
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>签到操作入口</title>
</head>
<body>
  <h3>签到操作入口</h3>

  <label>活动 ID：</label>
  <input id="acid" value="25">

  <button onclick="openPlatform()">
    打开学校平台
  </button>

  <p>打开学校平台后，点击预先保存的 POST 书签。</p>

  <script>
    function openPlatform() {
      const acid = document.getElementById("acid").value;
      sessionStorage.setItem("acid", acid);
      location.href = "https://plat.hxxy.edu.cn/";
    }
  </script>
</body>
</html>
